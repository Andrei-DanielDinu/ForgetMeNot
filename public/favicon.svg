<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="petal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="petal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="centerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Flower Petals in Circular Fibonacci symmetry -->
  <g transform="translate(256, 256)">
    <!-- 5 Petals of Forget-Me-Not -->
    <path d="M 0,-30 C -60,-130 -110,-110 -70,-30 Z" fill="url(#petal1)" transform="rotate(0)" />
    <path d="M 0,-30 C -60,-130 -110,-110 -70,-30 Z" fill="url(#petal2)" transform="rotate(72)" />
    <path d="M 0,-30 C -60,-130 -110,-110 -70,-30 Z" fill="url(#petal1)" transform="rotate(144)" />
    <path d="M 0,-30 C -60,-130 -110,-110 -70,-30 Z" fill="url(#petal2)" transform="rotate(216)" />
    <path d="M 0,-30 C -60,-130 -110,-110 -70,-30 Z" fill="url(#petal1)" transform="rotate(288)" />
    
    <!-- Central Fibonacci Spiral Path -->
    <path d="M 0,0 
             A 10,10 0 0,1 10,10 
             A 20,20 0 0,1 -10,30 
             A 35,35 0 0,1 -45,-5 
             A 60,60 0 0,1 15,-65" 
          fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Center golden eye -->
    <circle cx="0" cy="0" r="28" fill="url(#centerGlow)" />
    <circle cx="0" cy="0" r="14" fill="#ca8a04" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" />
  </g>
</svg>
